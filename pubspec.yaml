name: reels_assignment
description: "A clean architecture starter for reels assignment."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core architecture
  get_it: ^8.0.3
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1

  # Firebase
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.8

  # Network
  dio: ^5.8.0+1
  internet_connection_checker: ^3.0.1

  # Local storage (SQLite)
  sqflite: ^2.4.2
  path: ^1.9.1

  # Reels playback
  video_player: ^2.10.0
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
